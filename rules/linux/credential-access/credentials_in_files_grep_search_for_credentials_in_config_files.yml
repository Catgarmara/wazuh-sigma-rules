name: wazuh_101254
status: experimental
description: 'T1552.001 - Credentials in Files: Grep search for credentials in config files.'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.credential-access
- attack.t1552.001
logsource:
  product: linux
  service: sudo
detection:
  selection:
    'CommandLine|re|i': '(\bgrep\b\s+-[rRi]*\s+.*(password|passwd|secret|token|api_key|credential).*\.(conf|cfg|ini|env|yml|yaml|json|xml|properties))'
