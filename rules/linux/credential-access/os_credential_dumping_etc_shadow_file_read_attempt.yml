title: 'OS Credential Dumping: /etc/shadow file read attempt'
id: a660ed62-fcae-5194-a447-cbd9cf314c99
name: wazuh_101250
status: experimental
description: 'T1003.008 - OS Credential Dumping: /etc/shadow file read attempt.'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.credential-access
- attack.t1003.008
logsource:
  product: linux
  service: sudo
detection:
  selection:
    'CommandLine|re|i': '(\bcat\b\s+\/etc\/shadow|\bawk\b.*\/etc\/shadow|\bsed\b.*\/etc\/shadow)'
