title: 'Clear Linux Logs: Log file deletion or truncation detected'
id: 715374fb-dec4-5938-a41e-14e1c9e15283
name: wazuh_101200
status: experimental
description: 'T1070.002 - Clear Linux Logs: Log file deletion or truncation detected.'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.defense-impairment
- attack.t1685.006
logsource:
  product: linux
  service: sudo
detection:
  selection:
    'CommandLine|re|i': '(\brm\b\s+(-rf?\s+)?\/var\/log\/|truncate\s+.*\/var\/log\/|echo\s*>\s*\/var\/log\/)'
  condition: selection
falsepositives:
- Unknown
level: high
wazuh_rule_id:
- '101200'
