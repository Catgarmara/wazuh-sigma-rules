title: 'API Abuse: Sequential ID enumeration on API'
id: 14116e4d-8387-50ea-ade8-fbf3b96d3e02
name: wazuh_100709
status: experimental
description: 'API Abuse: Sequential ID enumeration on API — potential IDOR/data scraping. (Merges Wazuh rule 100313, the other log stream''s variant.)'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: webserver
  product: nginx
detection:
  selection:
    'cs-uri-query|re|i': '(\/api\/v\d+\/users\/\d+|\/api\/.*\bid=\d+)'
  condition: selection
falsepositives:
- Unknown
level: medium
wazuh_rule_id:
- '100313'
- '100709'
