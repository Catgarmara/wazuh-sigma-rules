title: 'WordPress: PHP file in uploads directory'
id: 1a8a1a25-6bfd-569a-980d-edd971133f2a
name: wazuh_100481
status: experimental
description: 'WordPress: PHP file in uploads directory — web shell likely.'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.persistence
- attack.t1505.003
logsource:
  category: webserver
  product: nginx
detection:
  selection:
    'cs-uri-query|re|i': '(\/wp-content\/uploads\/.*\.(php[3-8]?|phtml|phar))'
  condition: selection
falsepositives:
- Unknown
level: medium
wazuh_rule_id:
- '100481'
- '100825'
