title: 'Wordpress Attacks: attack pattern returned HTTP 200'
id: 83975957-2d7a-54f5-becd-af60b5bd99aa
name: wazuh_100832
status: experimental
description: 'Wordpress Attacks: attack pattern returned HTTP 200 — server processed the request.'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: webserver
  product: nginx
detection:
  selection_attack:
    'cs-uri-query|re|i':
    - '(\/\?author=\d+|\/wp-json\/.*\/users\/\d+)'
    - '(\/wp-admin\/(admin-ajax|admin-post)\.php\?action=(revslider|showbiz|uploadify))'
    - '(\/wp-config\.php\.bak|\/wp-config\.php\.old|\/wp-config\.php\.save|\/wp-config\.txt)'
    - '(\/wp-content\/plugins\/.*\.(php|phtml)(\?|$))'
    - '(\/wp-content\/uploads\/.*\.(php[3-8]?|phtml|phar))'
    - '(\/wp-includes\/(wp-db|class-wp|version)\.php\?)'
    - '(\/wp-json\/wp\/v2\/users\b|\/\?rest_route=\/wp\/v2\/users)'
    - '(\/xmlrpc\.php\b.*methodName.*(wp\.getUsersBlogs|system\.multicall|pingback\.ping))'
  selection_success:
    sc-status: 200
  condition: selection_attack and selection_success
falsepositives:
- Unknown
level: high
wazuh_rule_id:
- '100832'
