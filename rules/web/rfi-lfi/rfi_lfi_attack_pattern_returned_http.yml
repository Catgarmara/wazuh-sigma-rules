title: 'RFI/LFI: attack pattern returned HTTP 200'
id: 011aafa4-6a75-5238-90bd-306e636da947
name: wazuh_100778
status: experimental
description: 'RFI/LFI: attack pattern returned HTTP 200 — server processed the request.'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: webserver
  product: nginx
detection:
  selection_attack:
    'cs-uri-query|re|i':
    - '(=(https?|ftp|php|zip|data|expect|input|filter):\/\/)'
    - '(\.\.\/(\.\.\/){2,}|(\%2e){2}(\%2f|\%5c))'
    - '(\.htaccess|\.htpasswd|wp-config\.php|web\.config|\.env)'
    - '(\/etc\/passwd|\/etc\/shadow|\/etc\/hosts|\/etc\/group)'
    - '(\/proc\/self\/(environ|cmdline|fd|maps|status))'
    - '(\/var\/log\/(apache2?|nginx|syslog|auth\.log|messages))'
    - '(boot\.ini|win\.ini|system\.ini|\\windows\\system32)'
    - '(expect:\/\/|zip:\/\/|phar:\/\/|glob:\/\/)'
    - '(php:\/\/filter\/(read|convert)|php:\/\/input|php:\/\/data)'
  selection_success:
    sc-status: 200
  condition: selection_attack and selection_success
falsepositives:
- Unknown
level: high
wazuh_rule_id:
- '100778'
