title: 'SSRF: attack pattern returned HTTP 200'
id: 0a8efe11-ea05-5818-a1ad-28377bdcab06
name: wazuh_100799
status: experimental
description: 'SSRF: attack pattern returned HTTP 200 — server processed the request.'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: webserver
  product: nginx
detection:
  selection_attack:
    'cs-uri-query|re|i':
    - '(=(gopher|dict|ldap|tftp):\/\/)'
    - '(=https?:\/\/(10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+))'
    - '(=https?:\/\/(127\.0\.0\.1|localhost|0\.0\.0\.0|0x7f))'
    - '(=https?:\/\/(2130706433|017700000001|0x7f000001))'
    - '(=https?:\/\/169\.254\.169\.254)'
    - '(=https?:\/\/[^/]*@[^/]*\/|=https?:\/\/[^/]*%40[^/]*\/)'
    - '(=https?:\/\/\[::1\]|=https?:\/\/\[0:0:0:0:0:0:0:1\])'
    - '(\/latest\/meta-data|\/latest\/user-data|\/metadata\/instance)'
  selection_success:
    sc-status: 200
  condition: selection_attack and selection_success
falsepositives:
- Unknown
level: high
wazuh_rule_id:
- '100799'
