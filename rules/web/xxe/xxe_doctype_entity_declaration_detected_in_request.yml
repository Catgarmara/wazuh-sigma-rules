title: 'XXE: DOCTYPE ENTITY declaration detected in request'
id: 9e06f7c7-9393-5280-bfe5-ad593d29d919
name: wazuh_100843
status: experimental
description: 'XXE: DOCTYPE ENTITY declaration detected in request. (Merges Wazuh rule 100200, the other log stream''s variant.)'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: webserver
  product: nginx
detection:
  selection:
    'cs-uri-query|re|i': '(\<!DOCTYPE\b[^>]*\bENTITY\b|\<!ENTITY\b|%3c(%21|!)(doctype|entity)|%253c(%2521|!)(doctype|entity))'
  condition: selection
falsepositives:
- Unknown
level: medium
wazuh_rule_id:
- '100200'
- '100843'
