title: 'XXE: SYSTEM entity with external URI'
id: f5d3ddd5-6167-5940-a328-ba09e62157b3
name: wazuh_100201
status: experimental
description: 'XXE: SYSTEM entity with external URI — file read or SSRF attempt.'
author: Catgarmara
date: '2026-10-12'
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: webserver
  product: nginx
detection:
  selection:
    'cs-uri-query|re|i': '(\bSYSTEM\b\s+["''](file|https?|ftp|php|expect|data):\/\/)'
  condition: selection
falsepositives:
- Unknown
level: medium
wazuh_rule_id:
