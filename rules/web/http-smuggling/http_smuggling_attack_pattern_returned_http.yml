    - '(Transfer-Encoding\s*:\s*chunked.*Content-Length|Content-Length.*Transfer-Encoding\s*:\s*chunked)'
    - '(\r\n\r\n.*\b(GET|POST|PUT|DELETE|PATCH)\s+\/)'
  selection_success:
    sc-status: 200
  condition: selection_attack and selection_success
falsepositives:
- Unknown
